name: Banking CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Compile all modules
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Run Account Service tests
        run: >
          mvn --batch-mode --no-transfer-progress
          -pl account-service
          "-Dtest=AccountServiceTest,AccountControllerTest"
          test

      - name: Run Transaction Service tests
        run: >
          mvn --batch-mode --no-transfer-progress
          -pl transaction-service
          "-Dtest=AccountClientErrorDecoderTest,AccountClientProxyTest,TransactionServiceUnavailableTest"
          test
