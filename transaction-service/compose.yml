services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE gerekli}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER gerekli}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD gerekli}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD gerekli}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: